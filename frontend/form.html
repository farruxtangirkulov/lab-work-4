<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amity University | Registration Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="brand">
            <img src="img/c872094c4bd175b92d043546b0f4e924.jpg" alt="Amity University Logo" class="logo">
            <div>
                <h1>Amity University</h1>
                <p>Web Technologies – Lab Work 4</p>
            </div>
        </div>
        <nav>
            <a href="index.html">Home (Frame)</a>
            <a href="form.html" class="active">Form</a>
            <a href="table.html">Table</a>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Page 2: Student Registration Form</h2>
            <p>Fill in the details below. Data is sent to <code>backend/submit.php</code> using the POST method and saved on the server.</p>

            <!-- Important form attributes:
                 method = "post"  -> data travels hidden in the request body
                 id     = "studentForm" -> js/app.js intercepts the submit event -->
            <form id="studentForm" method="post" action="../backend/submit.php">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Aarav Sharma" required>
                </div>

                <div class="form-group">
                    <label for="enrollment">Enrollment Number</label>
                    <input type="text" id="enrollment" name="enrollment" placeholder="e.g. A2305214567" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="e.g. student@amity.edu" required>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" name="course" required>
                        <option value="" disabled selected>-- Select Course --</option>
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="BCA">BCA</option>
                        <option value="B.Sc IT">B.Sc IT</option>
                    </select>
                </div>

                <div class="form-group">
                    <span class="label-text">Gender</span>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="Male" required> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="marks">Marks (0 – 100)</label>
                    <input type="number" id="marks" name="marks" min="0" max="100" placeholder="e.g. 85" required>
                </div>

                <div class="buttons">
                    <button type="submit" class="btn-primary">Submit</button>
                    <button type="reset" class="btn-secondary">Reset</button>
                </div>

                <!-- Server response appears here -->
                <p id="formMessage" class="form-message" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Amity University Lab Work 4 | HTML, CSS, JavaScript &amp; PHP</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
